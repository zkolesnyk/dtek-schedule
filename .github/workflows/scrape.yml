name: scrape
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python scraper.py
        env:
          STREETS: ${{ secrets.STREETS }}
      # Гілка data — лише останній знімок (один коміт), щоб історія не росла
      - name: publish
        run: |
          cd out
          git init -q -b data
          git config user.name "dtek-bot"
          git config user.email "dtek-bot@users.noreply.github.com"
          git add schedule.json
          git commit -qm "schedule $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
